<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register • FAM FASHION HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
<link rel="stylesheet" href="../../css/style.css" />

</head>
<body>
<div class="auth-shell">
  
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-logo">F</div>
    <h4 class="mb-1">Create account</h4>
    <p class="text-muted-2 mb-0">Get started with FAM FASHION HUB</p>
  </div>
  <form onsubmit="return ffhSubmit(event,'Account created')">
    <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" required></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" required id="tos"><label class="form-check-label" for="tos">I agree to the Terms & Privacy Policy</label></div>
    <button class="btn btn-primary w-100">Create Account</button>
    <p class="text-center mt-3 mb-0 text-muted-2">Already have an account? <a href="login.html">Sign in</a></p>
  </form>
</div>

</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../js/main.js"></script>

</body>
</html>
