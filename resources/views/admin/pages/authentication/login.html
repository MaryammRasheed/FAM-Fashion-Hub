<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login • FAM FASHION HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
<link rel="stylesheet" href="../../css/style.css" />

</head>
<body>
<div class="auth-shell">
  
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-logo">F</div>
    <h4 class="mb-1">Welcome back</h4>
    <p class="text-muted-2 mb-0">Sign in to FAM FASHION HUB Admin</p>
  </div>
  <form onsubmit="return ffhSubmit(event,'Logged in')">
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="admin@famfashionhub.com" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" placeholder="••••••••" required></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check"><input class="form-check-input" type="checkbox" id="rm"><label class="form-check-label" for="rm">Remember me</label></div>
      <a href="forgot-password.html">Forgot password?</a>
    </div>
    <button class="btn btn-primary w-100 mb-3">Sign In</button>
    <div class="text-center text-muted-2 mb-3">or continue with</div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary w-100"><i class="fa-brands fa-google me-1"></i>Google</button>
      <button type="button" class="btn btn-outline-secondary w-100"><i class="fa-brands fa-facebook me-1"></i>Facebook</button>
    </div>
    <p class="text-center mt-3 mb-0 text-muted-2">No account? <a href="register.html">Create one</a></p>
    <p class="text-center mt-2 mb-0"><a href="../../index.html" class="small">← Back to dashboard</a></p>
  </form>
</div>

</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../js/main.js"></script>

</body>
</html>
